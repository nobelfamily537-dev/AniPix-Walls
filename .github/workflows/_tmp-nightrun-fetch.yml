name: _tmp nightrun fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/nightrun/trigger.txt"]
concurrency:
  group: nightrun
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Fetch previews
        run: python _tmp/nightrun/fetch.py
      - name: Commit previews
        run: |
          git config user.name "anipix-bot"
          git config user.email "bot@anipix.local"
          git add _tmp/nightrun
          git commit -m "nightrun: preview candidates" || echo "nothing"
          git push || true
