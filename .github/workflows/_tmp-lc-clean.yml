name: _tmp lc clean
on:
  push:
    paths:
      - "_tmp/lcC/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python _tmp/lcC/clean.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "Remove low-count run scratch files" && git push; fi
