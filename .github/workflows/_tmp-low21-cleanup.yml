name: _tmp low21 cleanup
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low21/trigger_cleanup.txt"]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Delete rejected files
        run: python _tmp/low21/cleanup.py
      - name: Remove temp assets and workflows
        run: |
          git rm -r -q --sparse _tmp/low21 || true
          rm -rf _tmp/low21
          for f in .github/workflows/_tmp-low21-*.yml; do git rm -q --sparse "$f" 2>/dev/null || true; rm -f "$f"; done
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          git diff --cached --quiet && echo nothing || (git commit -m "chore: trim rejected low-count wallpapers and clean low21 temp assets" && git pull --rebase origin main && git push)
