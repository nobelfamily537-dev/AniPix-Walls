name: _tmp lowrun19 process
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun19/trigger_process.txt"]
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/lowrun19/process.py
      - name: Commit leftovers
        if: always()
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/lowrun19
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: lowrun19 process log" && git push)
