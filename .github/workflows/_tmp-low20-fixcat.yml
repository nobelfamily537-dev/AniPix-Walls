name: _tmp low20 fixcat
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low20/trigger_fixcat.txt"]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/low20/fixcat.py
      - name: Cleanup previews
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          rm -rf _tmp/low20/prev _tmp/low20/prev2 _tmp/low20/prev3 _tmp/low20/prev4
          rm -rf _tmp/low20/sheets _tmp/low20/sheets2 _tmp/low20/sheets3 _tmp/low20/sheets4
          git add -A _tmp/low20
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low20 cleanup" && git push)
