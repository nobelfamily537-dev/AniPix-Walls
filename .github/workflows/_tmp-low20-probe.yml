name: _tmp low20 probe
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low20/trigger_probe.txt"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python _tmp/low20/probe.py
