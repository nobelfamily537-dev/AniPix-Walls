name: _tmp lowrun15 fetch4
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun15/trigger_fetch4.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp/lowrun15
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/lowrun15/fetch4.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/lowrun15
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: lowrun15 fetch4 previews" && git push)
