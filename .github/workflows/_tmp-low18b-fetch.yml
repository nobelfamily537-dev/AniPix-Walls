name: _tmp low18b fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low18b/trigger_fetch.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _tmp/low18
            _tmp/low18b
            wallpapers.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/low18b/fetch2.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/low18b
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low18b fetch previews" && (git pull --rebase -q || true) && git push)
