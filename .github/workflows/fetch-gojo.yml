name: Fetch Gojo pins
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p _incoming
          fetch_one() {
            h="$1"; out="$2"
            for v in originals 1200x 736x; do
              url="https://i.pinimg.com/$v/$h.jpg"
              code=$(curl -sS -L --max-time 60 -A "Mozilla/5.0" -o "_incoming/$out.jpg" -w "%{http_code}" "$url" || echo 000)
              if [ "$code" = "200" ] && [ -s "_incoming/$out.jpg" ]; then
                echo "$out OK $v $(stat -c%s _incoming/$out.jpg) bytes"
                return 0
              fi
            done
            echo "$out FAILED"
            rm -f "_incoming/$out.jpg"
          }
fetch_one "996869c25592453dec2f5c2c669422e3" g01
