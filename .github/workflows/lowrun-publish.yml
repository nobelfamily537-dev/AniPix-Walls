name: lowrun publish
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun_pub_trigger.txt"]
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: |
          if [ -f _tmp/lowrun_cleanup.py ]; then python _tmp/lowrun_cleanup.py; elif [ -f _tmp/lowrun_fix.py ]; then python _tmp/lowrun_fix.py; else python _tmp/lowrun_publish.py; fi
      - name: Report
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: lowrun report" && git push)
