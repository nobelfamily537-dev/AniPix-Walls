name: Lowcount fetch
on:
  push:
    paths:
      - "_stage/trigger.txt"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Source diag
        continue-on-error: true
        run: python3 _stage/diag_src.py
      - name: Commit
        if: always()
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          git commit -m "source diag" || true
          git push || true
