name: Lowcount probe
on:
  push:
    paths:
      - "_stage/trigger.txt"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        continue-on-error: true
        run: python3 _stage/probe.py
      - name: Commit
        if: always()
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          echo "done" > _stage/probe_done.txt
          git add -A
          git commit -m "lowcount probe 3" || true
          git push || true
