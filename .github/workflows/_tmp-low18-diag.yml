name: _tmp low18 diag
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low18/trigger_diag.txt"]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _tmp/low18
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python _tmp/low18/diag.py
