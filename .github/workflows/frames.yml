name: Probe video frames
on:
  workflow_dispatch:
    inputs:
      vid:
        description: "live/<id>.mp4"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract candidate frames
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          V="live/${{ inputs.vid }}.mp4"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          echo "duration=$DUR"
          for P in 10 30 50 70 90; do
            T=$(python3 -c "print(float('$DUR')*$P/100.0)")
            ffmpeg -y -loglevel error -ss "$T" -i "$V" -frames:v 1 \
              -vf "scale=360:640:force_original_aspect_ratio=increase,crop=360:640" \
              -q:v 3 "live/_probe_${{ inputs.vid }}_$P.jpg"
          done
          ls -la live/_probe_* | head
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          git commit -m "Probe frames for ${{ inputs.vid }}" || echo "nothing"
          git push
