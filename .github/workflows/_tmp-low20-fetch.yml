name: _tmp low20 fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low20/trigger_fetch.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/low20/fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/low20
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low20 fetch previews" && git push)
