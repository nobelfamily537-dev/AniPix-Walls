name: _tmp lowrun15 probe3
on:
  push:
    paths: ["_tmp/lowrun15/trigger_probe3.txt"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp/lowrun15
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pillow
      - run: python _tmp/lowrun15/probe3.py
