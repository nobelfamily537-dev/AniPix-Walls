name: _tmp gapnight process
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/gapnight/picks.json"]
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
            anime
            anime2
            wallpapers.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/gapnight/process.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          N=$(python3 -c "import json;print(len(json.load(open('_tmp/gapnight/added.json'))))")
          git add -A anime anime2 wallpapers.json _tmp/gapnight
          git diff --cached --quiet && echo nothing || (git commit -m "Nightly wallpaper add - 2026-11-15 ($N new)" && git push)
