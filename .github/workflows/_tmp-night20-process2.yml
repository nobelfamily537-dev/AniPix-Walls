name: _tmp night20 process2
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/night20/trigger_process2.txt"]
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            wallpapers.json
            _tmp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/night20/process2.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          N=$(python3 -c "import json;print(len(json.load(open('_tmp/night20/added.json'))))")
          git ls-files -s anime | wc -l
          git ls-files -s anime2 | wc -l
          git commit -m "Nightly wallpaper add - 2026-11-20 ($N new)"
          git push
