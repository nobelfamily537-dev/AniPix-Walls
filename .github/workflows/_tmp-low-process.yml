name: _tmp low-count process
on:
  workflow_dispatch:
    inputs:
      picks:
        description: "picks json path"
        default: "_tmp/picks_low.json"
      final:
        description: "1 = bump version"
        default: "0"
      msg:
        description: "commit message"
        default: "Wallpaper top-up"
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/process_low.py
        env:
          PICKS: ${{ inputs.picks }}
          FINAL: ${{ inputs.final }}
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          git diff --cached --quiet && echo nothing || (git commit -m "${{ inputs.msg }}" && git push)
