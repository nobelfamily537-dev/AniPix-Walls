name: _tmp low13 process
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low13p_trigger.txt"]
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
            wallpapers.json
            anime
            anime2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests numpy
      - run: python _tmp/low13_process.py
