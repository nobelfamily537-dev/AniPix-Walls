name: Nightly bot

on:
  push:
    paths:
      - ".nightly/config.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stash config
        run: cp .nightly/config.json /tmp/cfg.json

      - name: Install deps
        run: pip install --quiet requests pillow

      - name: Run bot
        run: python scripts/nightly_bot.py

      - name: Push results
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          MODE=$(python -c "import json;print(json.load(open('/tmp/cfg.json'))['mode'])")
          MSG=$(python -c "import json;print(json.load(open('/tmp/cfg.json')).get('message','Nightly wallpaper add'))")
          echo "mode=$MODE"
          if [ "$MODE" = "fetch" ]; then
            git checkout -B nightly-candidates
            git add -A _cand
            git commit -m "Nightly candidates" || echo "nothing"
            git push -f origin nightly-candidates
          else
            rm -rf _cand
            git add -A
            git commit -m "$MSG" || echo "nothing"
            git push origin HEAD:main
          fi
