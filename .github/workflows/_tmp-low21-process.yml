name: _tmp low21 process
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "picks file"
        required: true
        default: "picks_batch1.json"
      bump:
        description: "bump version (1/0)"
        required: true
        default: "0"
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Process
        run: |
          if [ "${{ inputs.bump }}" = "1" ]; then
            python _tmp/low21/process.py "${{ inputs.batch }}" --bump
          else
            python _tmp/low21/process.py "${{ inputs.batch }}"
          fi
      - name: Commit
        run: |
          N=$(head -1 _tmp/low21/stats.txt | cut -d' ' -f1)
          M=$(head -1 _tmp/low21/stats.txt | cut -d' ' -f2)
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A wallpapers.json _tmp/low21
          git add --sparse anime anime2 game nature
          git diff --cached --quiet && echo nothing || (git commit -m "Wallpaper top-up - 2026-11-18 (${N} new across ${M} series)" && git pull --rebase origin main && git push)
