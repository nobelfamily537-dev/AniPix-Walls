name: _tmp lowrun22 process33
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun22/proc.txt"]
concurrency:
  group: lowrun22proc
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Process
        run: python _tmp/lowrun22/process3.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add wallpapers.json anime anime2 _tmp/lowrun22/result.json
          if git diff --cached --quiet; then echo nothing; else
            git commit -m "Wallpaper top-up - 2026-11-21 (low-count series)"
            git push
          fi
