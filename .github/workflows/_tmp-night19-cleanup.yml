name: _tmp night19 cleanup
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/night19/trigger_cleanup.txt"]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/night19/cleanup.py
