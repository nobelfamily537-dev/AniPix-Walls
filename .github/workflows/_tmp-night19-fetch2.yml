name: _tmp night19 fetch2
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/night19/trigger_fetch2.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/night19/fetch2.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/night19
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: night19 fetch2 previews" && git pull --rebase origin main && git push)
