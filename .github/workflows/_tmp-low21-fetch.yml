name: _tmp low21 fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low21/trigger_fetch.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/low21/fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/low21
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low21 fetch previews" && git pull --rebase origin main && git push)
