name: _tmp lc tagfix
on:
  push:
    paths:
      - "_tmp/lc/trigger-tagfix.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/lc/tagfix.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A wallpapers.json
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "Richer tags for new low-count wallpapers" && git push; fi
