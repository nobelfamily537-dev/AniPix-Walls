name: _tmp low qprobe
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowqprobe.txt"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python _tmp/low_qprobe.py
