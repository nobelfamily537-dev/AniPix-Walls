name: _tmp gap20 fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/gap20/trigger_fetch.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/gap20/probe2.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/gap20
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: gap20 fetch previews" && git push)
