name: _tmp lowrun15 cleanup
on:
  push:
    paths: ["_tmp/lowrun15/trigger_cleanup*.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cleanup
        run: |
          N=$(ls _tmp/lowrun15/trigger_cleanup*.txt | tail -1 | sed 's/.*trigger_cleanup//; s/\.txt$//')
          echo "cleanup batch $N"
          REMOVE="_tmp/lowrun15/remove$N.json" python _tmp/lowrun15/cleanup.py
