name: _tmp lc ext
on:
  push:
    paths:
      - "_tmp/lcA/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ext:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow numpy
      - run: python _tmp/lcA/ext.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "Low-count batch: smooth edge fill for letterboxed art" && git push; fi
