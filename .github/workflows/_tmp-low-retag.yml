name: _tmp low-count retag
on:
  workflow_dispatch:
jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/retag_low.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          git diff --cached --quiet && echo nothing || (git commit -m "Enrich tags for 2026-11-12 top-up" && git push)
