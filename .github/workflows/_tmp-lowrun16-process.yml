name: _tmp lowrun16 process
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun16/trigger_process.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Run processor
        run: PICKS="_tmp/lowrun16/picks.json" python _tmp/lowrun16/process.py
      - name: Cleanup previews
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          rm -rf _tmp/lowrun16/prev _tmp/lowrun16/sheets
          git add -A _tmp/lowrun16
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: lowrun16 cleanup" && git push)
