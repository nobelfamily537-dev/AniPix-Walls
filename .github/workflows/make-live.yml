name: Make live wallpapers from images

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Repo image paths (space separated), e.g. game/pinabc.jpg"
        required: true
      tags:
        description: "Comma separated tags"
        required: false
        default: ""
      duration:
        description: "Seconds per clip"
        required: false
        default: "6"

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow

      - name: Convert to live wallpapers
        env:
          SOURCE_PATHS: ${{ inputs.sources }}
          TAGS: ${{ inputs.tags }}
          DURATION: ${{ inputs.duration }}
        run: python scripts/make_live.py

      - name: Commit and push
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Convert to live wallpapers (${{ inputs.tags }})"
            git push
          fi
