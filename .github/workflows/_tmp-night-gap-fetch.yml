name: _tmp night gap fetch

on:
  push:
    paths:
      - "_tmp/trigger.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python scripts/_tmp_nightfetch.py
      - name: push staging branch
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git checkout -B nightly-staging
          git add -f staging
          git commit -m "nightly staging $(date -u +%F)" || true
          git push -f origin nightly-staging
