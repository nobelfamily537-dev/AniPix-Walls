name: _tmp lowrun22d fetch3
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun22/trigger_d.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet pillow requests
      - run: PICKS=_tmp/lowrun22/picks2.json python _tmp/lowrun22/fetch3.py
      - name: Commit
        run: |
          git config user.name "anipix-agent"
          git config user.email "agent@anipix.local"
          git add -A _tmp/lowrun22
          git commit -m "lowrun22 stage1c previews" || true
          git pull --rebase --autostash || true
          git push || true
