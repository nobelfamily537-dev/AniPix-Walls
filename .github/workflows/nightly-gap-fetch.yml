name: Nightly gap fetch (staging artifact)

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Comma separated search queries"
        required: true
        default: ""
      per_query:
        description: "Max images per query"
        required: false
        default: "6"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet pillow requests
      - name: Fetch candidates
        env:
          QUERIES: ${{ inputs.queries }}
          PER_QUERY: ${{ inputs.per_query }}
        run: |
          python - <<'PY'
          import os, json, hashlib, io, time, requests
          from PIL import Image, ImageOps

          QUERIES = [q.strip() for q in os.environ.get("QUERIES","").split(",") if q.strip()]
          PER = int(os.environ.get("PER_QUERY","6") or 6)
          UA = {"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          os.makedirs("cand", exist_ok=True)
          manifest = []

          for q in QUERIES:
              params = {"q": q, "categories":"010", "purity":"100", "sorting":"toplist",
                        "order":"desc", "ratios":"9x16,10x16", "atleast":"1080x1900", "page":"1"}
              try:
                  r = requests.get("https://wallhaven.cc/api/v1/search", params=params, headers=UA, timeout=60)
                  r.raise_for_status()
                  items = r.json().get("data", [])
              except Exception as e:
                  print("APIERR", q, e); continue
              print(f"QUERY {q}: {len(items)} hits")
              got = 0
              for it in items:
                  if got >= PER: break
                  try:
                      resp = requests.get(it["path"], headers=UA, timeout=90)
                      resp.raise_for_status()
                      im = Image.open(io.BytesIO(resp.content)).convert("RGB")
                      if im.width < 900 or im.height < 1500:
                          continue
                      wid = "c" + hashlib.md5(it["id"].encode()).hexdigest()[:9]
                      full = ImageOps.fit(im, (1080,1920), method=Image.LANCZOS, centering=(0.5,0.38))
                      full.save(f"cand/{wid}.jpg","JPEG",quality=95,optimize=True,progressive=True)
                      full.resize((360,640), Image.LANCZOS).save(f"cand/{wid}_thumb.jpg","JPEG",quality=80,optimize=True,progressive=True)
                      manifest.append({"file":wid, "query":q, "wh_id":it["id"],
                                       "res":f'{it.get("dimension_x")}x{it.get("dimension_y")}',
                                       "tags":[t["name"] for t in it.get("tags",[])],
                                       "url":it["path"], "page":it.get("url","")})
                      got += 1
                  except Exception as e:
                      print("IMGERR", it.get("id"), e)
                  time.sleep(0.3)
              print(f"  kept {got}")

          json.dump(manifest, open("cand/manifest.json","w"), indent=1)
          print("TOTAL", len(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: cand/
          retention-days: 2
