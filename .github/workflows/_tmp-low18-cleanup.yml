name: _tmp low18 cleanup
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low18/trigger_cleanup.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove temp run files
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          rm -rf _tmp/low18 _tmp/low18b _tmp/low18c _tmp/low18d _tmp/low18e
          rm -f .github/workflows/_tmp-low18.yml .github/workflows/_tmp-low18b-fetch.yml \
                .github/workflows/_tmp-low18c-fetch.yml .github/workflows/_tmp-low18d-fetch.yml \
                .github/workflows/_tmp-low18e-fetch.yml .github/workflows/_tmp-low18-fetch.yml \
                .github/workflows/_tmp-low18-process.yml .github/workflows/_tmp-low18-probe.yml \
                .github/workflows/_tmp-low18-probe2.yml .github/workflows/_tmp-low18-diag.yml \
                .github/workflows/_tmp-low18-mapurls.yml
          git add -A _tmp .github/workflows
          git commit -m "Wallpaper top-up - 2026-11-20 (115 new across 10 series)" -m "Low-count run: gurren lagann 13, laid back camp 14, konosuba 14, re zero 12, steins gate 11, code geass 11, gundam 10, darling in the franxx 10, fullmetal alchemist 10, nisekoi 10. Removes temporary fetch/preview files from the run." || echo "nothing to commit"
          git push || (git pull --rebase -q && git push)
