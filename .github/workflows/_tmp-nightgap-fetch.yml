name: _tmp nightgap fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/nightgap/trigger.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Fetch candidates
        run: python _tmp/nightgap/fetch.py
      - name: Commit candidates
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/nightgap
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: nightgap candidates" && git push)
