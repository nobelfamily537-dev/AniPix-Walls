name: _tmp nightrun6 fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/nightrun6/trigger.txt"]
concurrency:
  group: nightrun6
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/nightrun6/fetch.py
      - name: Commit
        run: |
          git config user.name "anipix-bot"; git config user.email "bot@anipix.local"
          git pull --rebase || true
          git add _tmp/nightrun6
          git commit -m "nightrun6: previews" || echo nothing
          git push || (git pull --rebase && git push)
