name: _tmp low19 probe
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun19/trigger_probe.txt"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python _tmp/lowrun19/probe.py
