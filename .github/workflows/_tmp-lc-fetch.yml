name: _tmp lc fetch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests numpy
      - name: Fetch candidates
        run: python _tmp/lc/fetch.py
      - name: Commit staging
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "tmp: lc fetch candidates" && git push; fi
