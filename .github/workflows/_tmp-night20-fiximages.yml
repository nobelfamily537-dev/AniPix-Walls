name: _tmp night20 fiximages
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/night20/trigger_fiximages.txt"]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            wallpapers.json
            _tmp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/night20/fiximages.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git diff --cached --name-only | wc -l
          git commit -m "Nightly wallpaper add - 2026-11-20 (20 new)"
          git push
