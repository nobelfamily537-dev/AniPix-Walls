name: _tmp low13 cleanup
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low13c_trigger.txt"]
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
            wallpapers.json
            anime
            anime2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/low13_cleanup.py
