name: fetch-incoming
on:
  push:
    paths:
      - '_night/run.txt'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          pip install --quiet requests pillow
          python3 - <<'PY'
          import json, os, re, html, time, io, requests
          from PIL import Image
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept-Language":"en-US,en;q=0.9"}
          os.makedirs("_night/out", exist_ok=True)
          man=[]
          spec=json.load(open("_night/spec.json"))
          for item in spec:
              label=item["label"]; want=item.get("count",10); got=0
              urls=[]
              g=item.get("gallery")
              if g:
                  try:
                      r=requests.get(g,headers=UA,timeout=45)
                      print("GALLERY",label,r.status_code,len(r.text))
                      pats=[r'https://wallpapercave\.com/wp/wp\d+\.jpg', r'https://wallpaperaccess\.com/full-images/[^"\'\s]+\.jpg', r'https://[^"\'\s]*\.(?:jpg|jpeg|png)']
                      found=re.findall(pats[0], r.text)
                      if not found: found=re.findall(pats[1], r.text)
                      if not found: found=re.findall(pats[2], r.text)
                      seen=set()
                      for u in found:
                          if u not in seen and re.search(r'\.(jpg|jpeg|png)$', u, re.I):
                              seen.add(u); urls.append(u)
                  except Exception as e:
                      print("GALERR",label,e)
              for u in urls:
                  if got>=want: break
                  try:
                      d=requests.get(u,headers=UA,timeout=45)
                      if d.status_code!=200 or len(d.content)<30000: continue
                      im=Image.open(io.BytesIO(d.content)); w,h=im.size
                      ar=w/h
                      if w<800 or h<1200 or ar<0.46 or ar>0.72: continue
                      fn=f"_night/out/{label}_{got+1:02d}.jpg"
                      open(fn,"wb").write(d.content); got+=1
                      man.append(f"{fn} {w}x{h} {u}")
                  except Exception:
                      continue
              print("GOT",label,got,"of",len(urls))
          open("_night/out/manifest.txt","w").write("\n".join(man))
          PY
          ls -l _night/out | head -100
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -f _night/out
          git commit -m "temp: fetch $(date -u +%FT%TZ)" || echo "nothing"
          git pull --rebase origin main || true
          git push
