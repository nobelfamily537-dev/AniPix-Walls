name: fetch-incoming
on:
  push:
    paths:
      - '_night/run.txt'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          pip install --quiet requests pillow
          python3 - <<'PY'
          import json, os, re, html, time, io, requests
          from PIL import Image
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept-Language":"en-US,en;q=0.9"}
          os.makedirs("_night/out", exist_ok=True)
          man=[]
          def bing_urls(q, pages=2):
              out=[]
              for p in range(pages):
                  first=1+p*35
                  try:
                      r=requests.get("https://www.bing.com/images/search",
                          params={"q":q,"first":first,"count":35,"form":"HDRSC3","qft":"+filterui:aspect-tall"},
                          headers=UA,timeout=45)
                      for m in re.finditer(r'murl&quot;:&quot;(.*?)&quot;', r.text):
                          out.append(html.unescape(m.group(1)))
                  except Exception as e:
                      print("bingerr",e)
                  time.sleep(1)
              return out
          def google_urls(q, pages=2):
              out=[]
              for p in range(pages):
                  try:
                      r=requests.get("https://www.google.com/search",
                          params={"q":q,"tbm":"isch","hl":"en","start":p*20},
                          headers=UA,timeout=45)
                      for m in re.finditer(r'\["(https?://[^"]+?\.(?:jpg|jpeg|png))",\d+,\d+\]', r.text):
                          out.append(m.group(1))
                  except Exception as e:
                      print("glerr",e)
                  time.sleep(1)
              return out
          spec=json.load(open("_night/spec.json"))
          seen=set()
          for item in spec:
              label=item["label"]; q=item["query"]; want=item.get("count",8); got=0
              cands=bing_urls(q) + google_urls(q)
              print("LABEL",label,"cands",len(cands))
              for u in cands:
                  if got>=want: break
                  if u in seen: continue
                  seen.add(u)
                  if not re.search(r'\.(jpg|jpeg|png)(\?|$)', u, re.I): continue
                  try:
                      d=requests.get(u,headers={**UA,"Referer":"https://www.pinterest.com/"},timeout=30)
                      if d.status_code!=200 or len(d.content)<40000: continue
                      im=Image.open(io.BytesIO(d.content)); w,h=im.size
                      ar=w/h
                      if w<800 or h<1200 or ar<0.46 or ar>0.72: continue
                      fn=f"_night/out/{label}_{got+1:02d}.jpg"
                      open(fn,"wb").write(d.content); got+=1
                      man.append(f"{fn} {w}x{h} {u}")
                      print("OK",fn,w,h)
                  except Exception as e:
                      continue
              print("GOT",label,got)
          open("_night/out/manifest.txt","w").write("\n".join(man))
          PY
          ls -l _night/out | head -80
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -f _night/out
          git commit -m "temp: fetch $(date -u +%FT%TZ)" || echo "nothing"
          git pull --rebase origin main || true
          git push
