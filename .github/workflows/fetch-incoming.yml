name: fetch-incoming
on:
  push:
    paths:
      - '_night/spec.json'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from danbooru
        run: |
          pip install --quiet requests
          python3 - <<'PY'
          import json, os, time, requests
          UA={"User-Agent":"AniPixNightly/1.0 (wallpaper sourcing)"}
          spec=json.load(open("_night/spec.json"))
          os.makedirs("_night/out", exist_ok=True)
          man=[]
          for item in spec:
              label=item["label"]; tags=item["tags"]; want=item.get("count",8)
              got=0
              for page in (1,2,3):
                  url="https://danbooru.donmai.us/posts.json"
                  params={"tags":tags,"limit":100,"page":page,"order":"score"}
                  try:
                      r=requests.get(url,params=params,headers=UA,timeout=60)
                      posts=r.json()
                  except Exception as e:
                      man.append(f"{label} APIFAIL {e}"); break
                  if not isinstance(posts,list) or not posts: break
                  for p in posts:
                      if got>=want: break
                      w=p.get("image_width") or 0; h=p.get("image_height") or 0
                      fu=p.get("file_url") or ""
                      if not fu or w<900 or h<1200: continue
                      ar=w/h
                      if ar<0.48 or ar>0.72: continue
                      ext=p.get("file_ext","jpg")
                      fn=f"_night/out/{label}_{got+1:02d}.{ext}"
                      try:
                          d=requests.get(fu,headers=UA,timeout=90); d.raise_for_status()
                          open(fn,"wb").write(d.content)
                          got+=1
                          man.append(f"{fn} {w}x{h} {p.get('tag_string_character','')} | src={p.get('id')}")
                      except Exception as e:
                          man.append(f"{fn} ERR {e}")
                      time.sleep(0.4)
                  if got>=want: break
                  time.sleep(1)
              print(label,"got",got)
          open("_night/out/manifest.txt","w").write("\n".join(man))
          PY
          ls -l _night/out | head -60
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add _night/out
          git commit -m "temp: fetch $(date -u +%FT%TZ)" || echo "nothing"
          git push
