name: fetch-incoming
on:
  push:
    paths:
      - '_night/run.txt'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          pip install --quiet requests
          python3 - <<'PY'
          import os, requests, time
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36","Referer":"https://www.pinterest.com/"}
          os.makedirs("_night/out", exist_ok=True)
          man=[]
          urls=[u.strip() for u in open("_night/urls.txt") if u.strip() and not u.startswith("#")]
          for i,u in enumerate(urls,1):
              for attempt in range(3):
                  try:
                      d=requests.get(u,headers=UA,timeout=60)
                      if d.status_code==200 and len(d.content)>20000:
                          fn=f"_night/out/v{i:02d}.jpg"
                          open(fn,"wb").write(d.content)
                          man.append(f"{fn} OK {u}"); print("OK",fn,len(d.content)); break
                      else:
                          print("BAD",d.status_code,u)
                  except Exception as e:
                      print("ERR",e)
                  time.sleep(3)
          open("_night/out/manifest2.txt","w").write("\n".join(man))
          PY
          ls -l _night/out | tail -20
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -f _night/out
          git commit -m "temp: fetch $(date -u +%FT%TZ)" || echo "nothing"
          git pull --rebase origin main || true
          git push
