name: _tmp low18 process
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Process
        run: python _tmp/low18/process.py
      - name: Cleanup previews
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          rm -rf _tmp/low18/prev _tmp/low18/sheets
          git add -A _tmp/low18
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low18 cleanup" && git push)
