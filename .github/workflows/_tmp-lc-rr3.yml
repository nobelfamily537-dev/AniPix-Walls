name: _tmp lc rr3
on:
  push:
    paths:
      - "_tmp/lc6/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rr:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests numpy
      - run: python _tmp/lc6/rr3.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "Low-count batch: reframe art that sat inside a larger dark canvas" && git push; fi
