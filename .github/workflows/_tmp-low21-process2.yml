name: _tmp low21 process2
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low21/trigger_process2.txt"]
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Process
        run: |
          if [ "1" = "1" ]; then
            python _tmp/low21/process.py "picks_batch2.json" --bump
          else
            python _tmp/low21/process.py "picks_batch2.json"
          fi
      - name: Commit
        run: |
          N=$(head -1 _tmp/low21/stats.txt | cut -d' ' -f1)
          M=$(head -1 _tmp/low21/stats.txt | cut -d' ' -f2)
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A wallpapers.json _tmp/low21
          for d in anime anime2 game nature; do if [ -d "$d" ]; then git add --sparse "$d"; fi; done
          git diff --cached --quiet && echo nothing || (git commit -m "Wallpaper top-up - 2026-11-18 (${N} new across ${M} series)" && git pull --rebase origin main && git push)
