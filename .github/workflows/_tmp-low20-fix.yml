name: _tmp low20 fix
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low20/trigger_fix.txt"]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/low20/fix.py
