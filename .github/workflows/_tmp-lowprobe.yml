name: _tmp low probe
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowprobe.txt"]
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python _tmp/low_probe.py
