name: _tmp lowrun17 cleanup
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun17/trigger_cleanup.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/lowrun17/cleanup.py
