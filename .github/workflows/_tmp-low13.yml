name: _tmp low13f
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low13_trigger.txt"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
            wallpapers.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/low13_fetch6.py
      - name: Commit previews
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low13f previews" && git push)
