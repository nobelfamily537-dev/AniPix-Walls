name: _tmp lc fixband
on:
  push:
    paths:
      - "_tmp/lc8/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fb:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow numpy
      - run: python _tmp/lc8/fixband.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "Low-count batch: trim empty borders and blur-fill frames" && git push; fi
