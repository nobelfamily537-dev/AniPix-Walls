name: _tmp night20 api commit
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/night20/trigger_api.txt"]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            wallpapers.json
            _tmp
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/night20/fixapi.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
