name: _tmp lowcount fix
on:
  push:
    paths: ["_tmp/trigger_fix.txt"]
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/fix_low.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          if git diff --cached --quiet; then echo nothing; else
            git commit -m "Wallpaper top-up - 2026-11-12 (99 new across 10 series)" && git push
          fi
