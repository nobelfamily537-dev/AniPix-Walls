name: _tmp low20 meta
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low20/trigger_meta.txt"]
jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/low20/fetch_meta.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/low20
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low20 meta" && git push)
