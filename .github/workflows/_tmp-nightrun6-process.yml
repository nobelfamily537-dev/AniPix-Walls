name: _tmp nightrun6 process
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/nightrun6/ptrigger.txt"]
concurrency:
  group: nightrun6p
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/nightrun6/process.py
      - name: Commit
        run: |
          git config user.name "anipix-bot"; git config user.email "bot@anipix.local"
          git add anime anime2 wallpapers.json _tmp/nightrun6
          git commit -m "Nightly wallpaper add - 2026-11-21 (21 new)" || echo nothing
          git pull --rebase || true
          git push
