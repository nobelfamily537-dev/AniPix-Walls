name: _tmp nightgap process
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/nightgap/process_trigger.txt"]
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Process and insert
        run: python _tmp/nightgap/process.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A anime anime2 wallpapers.json
          if git diff --cached --quiet; then echo nothing; else git commit -m "Nightly wallpaper add - 2026-11-16 (gap fill)" && git pull --rebase origin main && git push; fi
