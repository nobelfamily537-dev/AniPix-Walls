name: _tmp lc publish
on:
  push:
    paths:
      - "_tmp/lc/trigger-publish.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Enrich tags
        run: python _tmp/lc/enrich.py
      - name: Publish
        run: python _tmp/lc/publish.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          D=$(python -c "import json;d=json.load(open('_tmp/lc/approved.json'));print(d['date'])")
          N=$(python -c "import json;d=json.load(open('_tmp/lc/approved.json'));print(len(d['items']))")
          M=$(python -c "import json;d=json.load(open('_tmp/lc/approved.json'));print(len({i['slug'] for i in d['items']}))")
          git add -A
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "Wallpaper top-up - ${D} (${N} new across ${M} series)" && git push; fi
