name: _tmp lowrun22 fetch
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun22/trigger.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Fetch previews
        run: python _tmp/lowrun22/fetch.py
      - name: Commit previews
        run: |
          git config user.name "anipix-agent"
          git config user.email "agent@anipix.local"
          git add -A _tmp/lowrun22
          git commit -m "lowrun22 stage1 previews" || true
          git pull --rebase --autostash || true
          git push || true
