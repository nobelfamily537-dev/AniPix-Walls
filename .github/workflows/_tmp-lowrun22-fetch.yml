name: _tmp lowrun22 fetch6
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun22/trigger.txt"]
concurrency:
  group: lowrun22
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Fetch
        run: python _tmp/lowrun22/fetch6.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/lowrun22
          if git diff --cached --quiet; then echo nothing; else
            git commit -m "lowrun22: fetch candidates"
            git push
          fi
