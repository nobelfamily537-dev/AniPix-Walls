name: _tmp low18 mapurls
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/low18/trigger_map.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _tmp/low18
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python _tmp/low18/mapurls.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp/low18
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: low18 url map" && (git pull --rebase -q || true) && git push)
