name: _tmp lc refetch
on:
  push:
    paths:
      - "_tmp/lc9/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests numpy
      - run: python _tmp/lc9/refetch.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A
          if git diff --cached --quiet; then echo "nothing"; else git commit -m "Low-count batch: re-render all picks full-bleed from source" && git push; fi
