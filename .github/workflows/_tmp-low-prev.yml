name: _tmp low-count previews
on:
  workflow_dispatch:
jobs:
  prev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/low_prev.py
      - uses: actions/upload-artifact@v4
        with:
          name: prev-all
          path: |
            _tmp/prev_low/
            _tmp/cand_all.json
          retention-days: 3
