name: _tmp cleanup v8
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/cleantrigger8.txt"]
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python _tmp/cleanup8.py
