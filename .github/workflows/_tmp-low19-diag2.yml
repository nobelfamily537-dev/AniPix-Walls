name: _tmp low19 diag2
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun19/trigger_diag2.txt"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python _tmp/lowrun19/diag2.py
