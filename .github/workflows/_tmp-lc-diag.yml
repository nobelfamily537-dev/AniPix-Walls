name: _tmp lc diag
on:
  push:
    paths:
      - "_tmp/lc5/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests numpy
      - run: python _tmp/lc5/diag.py
