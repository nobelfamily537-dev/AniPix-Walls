name: _tmp lowrun18 process
on:
  workflow_dispatch:
  push:
    paths: ["_tmp/lowrun18/trigger_process.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Run processor
        run: PICKS="_tmp/lowrun18/picks.json" python _tmp/lowrun18/process.py
