name: _tmp lowrun18 process
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - name: Run processor
        run: |
          rm -rf _tmp/lowrun18/prev _tmp/lowrun18/sheets
          PICKS=_tmp/lowrun18/picks.json python _tmp/lowrun18/process.py
