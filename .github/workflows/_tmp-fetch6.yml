name: _tmp fetch phase6 games
on:
  push:
    paths: ["_tmp/trigger6.txt"]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python _tmp/fetch6.py
      - name: Commit
        run: |
          git config user.email "nobelfamily537@gmail.com"
          git config user.name "AniPix Bot"
          git add -A _tmp
          git diff --cached --quiet && echo nothing || (git commit -m "tmp: fetch phase5" && git push)
